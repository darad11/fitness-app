name: CI

# Arbeitszweige laufen über ihren Pull Request; main nach jedem Merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typen, Unit-Tests, Dokumente, Build
    # Fest auf 24.04: ubuntu-latest wechselt ab 19.10.2026 auf Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Version aus dem Lockfile für das Image der E2E-Jobs, damit Browser und Test-Paket passen.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:docs
      - run: pnpm build
      - run: pnpm check:bundle

  db:
    name: Datenbank (Postgres 17)
    # Migrationen aus supabase/migrations/ an einem frischen Postgres in der Hauptversion des
    # Servers, dazu der Test zur Sperre je Konto (A-05, D-349). psql bringt das Image des Runners mit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tools/test-db.mjs

  e2e:
    name: E2E (${{ matrix.engine }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Browser und Systempakete stecken im offiziellen Image von Playwright (D-344). Vorher lud
    # `playwright install --with-deps webkit` die Systempakete per apt, einmal 117 MB in 37 min.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.checks.outputs.playwright }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          E2E_ENGINES: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report
          retention-days: 7
