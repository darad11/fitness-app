name: CI

# Arbeitszweige laufen über ihren Pull Request; main nach jedem Merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typen, Unit-Tests, Dokumente, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:docs
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    name: E2E (${{ matrix.engine }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          E2E_ENGINES: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report
          retention-days: 7
